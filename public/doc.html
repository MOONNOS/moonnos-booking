<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>เอกสาร มูนนอส</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Trirong:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Moonnos document : consular seal (ivory + navy ink + brass gold) */
:root{--ink:#14233f;--gold:#a9802f;--gold2:#c9a14f;--soft:#f4ecd9;--paper:#fbf7ef;--line:#d9d1bf;--muted:#5a5f6c;--desk:#e9e4da;--barbg:#fbf7ef;--bartx:#14233f;--barline:#e3dac7;
--serif:"Trirong",Georgia,serif;--sans:"Sarabun","Noto Sans Thai",Tahoma,sans-serif}
@media(prefers-color-scheme:dark){:root{--desk:#0d1626;--barbg:#142038;--bartx:#efe9dc;--barline:#27334c}}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);font:15px/1.6 var(--sans);color:#111a2c;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* toolbar (screen only) */
.bar{position:sticky;top:0;z-index:5;background:var(--barbg);border-bottom:1px solid var(--barline);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar a,.bar button{font:inherit;font-weight:600;min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid var(--barline);background:transparent;color:var(--bartx);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.bar a:hover{border-color:var(--gold2)}
.bar .sgl{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--bartx)}
.bar select{font:inherit;min-height:44px;padding:6px 10px;border-radius:8px;border:1px solid var(--gold2);background:var(--barbg);color:var(--bartx);cursor:pointer}
.bar .p{background:linear-gradient(180deg,#e0bd72,#c9a14f);border-color:#c9a14f;color:#14233f;font-weight:700;margin-left:auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}

/* the A4 sheet */
.page{width:210mm;min-height:297mm;margin:18px auto;background:#fff;padding:14mm;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.08),0 14px 40px -12px rgba(0,0,0,.3)}
.page::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--ink) 0 72%,var(--gold2) 72%)}

/* header */
.head{display:flex;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--ink);box-shadow:0 3px 0 -2px #fff,0 4px 0 -2px var(--ink)}
.left{display:flex;gap:14px;align-items:center}
.lg{width:84px;height:84px;object-fit:contain;flex:none;border-radius:4px}
.biz{color:#2a3346}.biz b{display:block;font-family:var(--serif);font-weight:600;font-size:1.32em;color:var(--ink);line-height:1.35;margin-bottom:2px}.biz div{font-size:.92em}
.ttl{text-align:right}
.ttl h1{margin:0;font-family:var(--serif);font-weight:600;font-size:1.75em;line-height:1.25;color:var(--ink)}
.ttl small{display:block;color:var(--gold);font-size:.78em;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin:2px 0 8px}
.ttl div{font-size:.93em}

/* customer */
.meta{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin:16px 0 14px}
.box{border:1px solid var(--line);border-left:3px solid var(--gold2);border-radius:2px;padding:10px 14px;background:var(--paper)}
.box h3{margin:0 0 4px;font-size:.78em;color:var(--gold);font-weight:700;letter-spacing:.08em}
.box b{font-size:1.08em;color:var(--ink)}

/* items */
table{width:100%;border-collapse:collapse;margin-top:6px}
th,td{padding:8px 10px;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--ink);color:#fff;font-weight:600;font-size:.9em;border-bottom:2px solid var(--gold2)}
tr:nth-child(odd) td{background:#fcfaf5}
td.c:first-child{color:var(--muted)}
.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.c{text-align:center}

/* totals */
.tot{margin-left:auto;width:min(100%,330px);margin-top:10px}
.tot div{display:flex;justify-content:space-between;padding:5px 10px;font-variant-numeric:tabular-nums}
.tot .g{margin-top:4px;padding:9px 10px;font-family:var(--serif);font-weight:600;font-size:1.2em;color:var(--ink);background:var(--soft);border-top:3px double var(--ink);border-bottom:1px solid var(--gold2)}
.txt{margin:10px 0 14px;font-weight:600;color:var(--ink);text-align:right;font-size:.95em}
.box+.box{margin-top:8px}

/* signatures */
.sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:48px;text-align:center}
.sig div{border-top:1px solid #333;padding-top:6px;font-weight:600;color:var(--ink)}
.sig .sn{display:block;font-weight:500;color:#2a3346}.sig .sr{display:block;font-weight:600;margin-top:2px}
.sig div::after{content:"วันที่ ........ / ........ / ........";display:block;font-weight:400;color:var(--muted);font-size:.88em;margin-top:6px}

.ph{background:#f1e2b9;padding:0 6px;border-radius:4px}
.wm{position:absolute;inset:0;display:grid;place-items:center;font-size:110px;font-weight:700;color:rgba(178,40,40,.12);transform:rotate(-25deg);pointer-events:none;font-family:var(--serif);z-index:2}
pre{font:inherit;white-space:pre-wrap;margin:0}
.err{padding:40px 22px;text-align:center;color:var(--bartx)}

@media print{body{background:#fff}.bar{display:none}.page{margin:0;box-shadow:none;width:auto;min-height:0;padding:6mm 0 0}.page::before{top:0}@page{size:A4;margin:12mm 14mm}tr,.tot,.sig,.box{break-inside:avoid}}
@media screen and (max-width:800px){.page{width:auto;margin:0;padding:22px 16px 16px;box-shadow:none}.head,.meta{display:block}.ttl{text-align:left;margin-top:12px}.sig{gap:14px}.meta .box{margin-bottom:10px}.txt{text-align:left}th,td{padding:7px 6px}}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div id="app"></div>
<script>
const app = document.getElementById("app"), bar = document.getElementById("bar");
const PHX = /(\[[^\]]+\])/;
function txt(s) {
  const f = document.createDocumentFragment();
  String(s).split(PHX).forEach((p) => {
    if (!p) return;
    if (PHX.test(p)) { const e = document.createElement("span"); e.className = "ph"; e.textContent = p; f.append(e); } else f.append(p);
  });
  return f;
}
function el(tag, cls, text, attrs) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null && text !== "") e.append(txt(text));
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
const money = (n) => Number(n).toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const THD = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("th-TH", { day: "numeric", month: "long", year: "numeric" }); };

// จำนวนเงินตัวอักษรภาษาไทย
function bahtText(n) {
  const D = ["ศูนย์", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า"], U = ["", "สิบ", "ร้อย", "พัน", "หมื่น", "แสน"];
  const read = (s, more) => {
    let o = ""; const L = s.length;
    for (let i = 0; i < L; i++) {
      const x = +s[i], p = L - i - 1;
      if (!x) continue;
      if (p === 0 && x === 1 && (L > 1 || more)) o += "เอ็ด";
      else if (p === 1 && x === 2) o += "ยี่สิบ";
      else if (p === 1 && x === 1) o += "สิบ";
      else o += D[x] + U[p];
    }
    return o;
  };
  const intText = (str) => {
    str = str.replace(/^0+(?=\d)/, "");
    if (/^0*$/.test(str)) return "ศูนย์";
    const ch = [];
    while (str.length > 6) { ch.unshift(str.slice(-6)); str = str.slice(0, -6); }
    ch.unshift(str);
    return ch.map((c, i) => { const t = c.replace(/^0+/, ""); return t ? read(t, i > 0) : ""; }).join("ล้าน");
  };
  const cents = Math.round(Number(n) * 100), baht = Math.floor(cents / 100), sat = cents % 100;
  return intText(String(baht)) + "บาท" + (sat ? intText(String(sat)) + "สตางค์" : "ถ้วน");
}

const TITLE = { quotation: ["ใบเสนอราคา", "Quotation"], billing: ["ใบวางบิล", "Billing Note"], receipt: ["ใบเสร็จรับเงิน", "Receipt"] };

async function main() {
  const token = sessionStorage.getItem("t") || "";
  const id = new URLSearchParams(location.search).get("id");
  if (!token || !id) { app.append(el("p", "err", "กรุณาเข้าสู่ระบบที่หน้าแอดมินก่อน")); return; }
  const h = { Authorization: "Bearer " + token };
  const [a, b] = await Promise.all([
    fetch("/api/admin/docs/" + encodeURIComponent(id), { headers: h }).then((r) => r.json()),
    fetch("/api/admin/settings", { headers: h }).then((r) => r.json()),
  ]);
  if (!a.ok) { app.append(el("p", "err", "ไม่พบเอกสาร หรือหมดเวลาเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่ที่หน้าแอดมิน")); return; }
  const d = a.doc, s = b.settings || {};
  document.title = d.number;

  const back = el("a", null, "← กลับ", { href: "/docs" }), edit = el("a", null, "แก้ไข", { href: "/docs?edit=" + d.id });
  const pr = el("button", "p", "พิมพ์ / บันทึกเป็น PDF", { type: "button" });
  pr.onclick = () => window.print();
  // ผู้ลงนามฝั่งร้าน (เลือกก่อนพิมพ์ จำค่าไว้ในเครื่องนี้)
  const SIGNERS = ["พีรพัฒน์ มีสมนัย", "อัญชลี ลาภทวีสุขสันต์"];
  let signer = "";
  try { signer = localStorage.getItem("signer") || ""; } catch (e) {}
  if (signer !== "shop" && !SIGNERS.includes(signer)) signer = SIGNERS[0];
  const who = () => (signer === "shop" ? (s.business_name || "[ชื่อธุรกิจ]") : signer);
  const sl = el("label", "sgl", "ผู้ลงนาม"), sel = el("select", null, null, { "aria-label": "ผู้ลงนามฝั่งร้าน" });
  SIGNERS.concat(["shop"]).forEach((v) => { const o = el("option", null, v === "shop" ? "ชื่อร้าน" : v, { value: v }); if (v === signer) o.selected = true; sel.append(o); });
  sl.append(sel);
  bar.append(back, edit, sl, pr);

  const T = TITLE[d.type];
  const page = el("div", "page");
  if (d.status === "cancelled") page.append(el("div", "wm", "ยกเลิก"));

  const head = el("div", "head"), biz = el("div", "biz"), ttl = el("div", "ttl");
  biz.append(el("b", null, s.business_name || "[ชื่อธุรกิจ]"), el("div", null, s.business_address || "[ที่อยู่]"));
  biz.append(el("div", null, "เลขประจำตัวผู้เสียภาษี: " + (s.business_tax_id || "[เลขประจำตัวผู้เสียภาษี]")), el("div", null, "โทร: " + (s.business_phone || "[เบอร์โทร]")), el("div", null, "LINE: parker.n1"));
  ttl.append(el("h1", null, T[0]), el("small", null, T[1]), el("div", null, "เลขที่: " + d.number), el("div", null, "วันที่: " + THD(d.issue_date)));
  if (d.end_date) ttl.append(el("div", null, (d.type === "quotation" ? "ใช้ได้ถึงวันที่: " : "กำหนดชำระ: ") + THD(d.end_date)));
  if (d.ref_number) ttl.append(el("div", null, (d.type === "receipt" ? "อ้างอิงใบวางบิล: " : "อ้างอิงใบเสนอราคา: ") + d.ref_number));
  const left = el("div", "left"), lg = document.createElement("img");
  lg.src = "/logo.jpg"; lg.alt = "Moonnos"; lg.className = "lg"; lg.onerror = function () { lg.remove(); };
  left.append(lg, biz);
  head.append(left, ttl);

  const cust = el("div", "box");
  cust.append(el("h3", null, d.type === "quotation" ? "เสนอราคาให้" : d.type === "receipt" ? "ได้รับเงินจาก" : "วางบิลถึง"), el("b", null, d.customer_name));
  if (d.customer_address) cust.append(el("div", null, d.customer_address));
  if (d.customer_tax_id) cust.append(el("div", null, "เลขประจำตัวผู้เสียภาษี: " + d.customer_tax_id));
  if (d.customer_phone) cust.append(el("div", null, "โทร: " + d.customer_phone));
  const meta = el("div", "meta"); meta.append(cust);

  const tb = el("table"), thead = el("tr");
  ["ลำดับ", "รายการ", "จำนวน", "ราคา/หน่วย", "จำนวนเงิน"].forEach((x, i) => thead.append(el("th", i === 1 ? null : "c", x)));
  tb.append(thead);
  d.items.forEach((it, i) => {
    const tr = el("tr");
    tr.append(el("td", "c", String(i + 1)), el("td", null, it.description), el("td", "n", String(it.qty)), el("td", "n", money(it.price)), el("td", "n", money(Math.round(it.qty * Math.round(it.price * 100)) / 100)));
    tb.append(tr);
  });

  const tot = el("div", "tot");
  const line = (l, v, c) => { const r = el("div", c || ""); r.append(el("span", null, l), el("span", null, money(v))); tot.append(r); };
  line("รวมเป็นเงิน", d.subtotal);
  if (d.discount > 0) line("ส่วนลด", d.discount);
  if (d.vat_percent > 0) line("ภาษีมูลค่าเพิ่ม " + d.vat_percent + "%", d.vat_amount);
  line("รวมทั้งสิ้น", d.total, "g");

  page.append(head, meta, tb, tot, el("div", "txt", "(" + bahtText(d.total) + ")"));
  if (d.notes) { const n = el("div", "box"); n.append(el("h3", null, "หมายเหตุ"), el("pre", null, d.notes)); page.append(n); }
  if (s.payment_info && d.type !== "receipt") { const n = el("div", "box"); n.style.marginTop = "8px"; n.append(el("h3", null, "ช่องทางชำระเงิน"), el("pre", null, s.payment_info)); page.append(n); }
  const sig = el("div", "sig");
  const SIG = { quotation: ["ผู้เสนอราคา", "ผู้อนุมัติสั่งซื้อ"], billing: ["ผู้วางบิล", "ผู้รับวางบิล"], receipt: ["ผู้รับเงิน", "ผู้จ่ายเงิน"] }[d.type];
  const sg = (who, role) => { const x = el("div"); x.append(el("span", "sn", "(" + who + ")"), el("span", "sr", role)); return x; };
  const shopSig = sg(who(), SIG[0]);
  sel.onchange = () => { signer = sel.value; try { localStorage.setItem("signer", signer); } catch (e) {} shopSig.querySelector(".sn").textContent = "(" + who() + ")"; };
  sig.append(shopSig, sg(d.customer_name, SIG[1]));
  page.append(sig);
  app.append(page);
}
main().catch(() => { app.append(el("p", "err", "โหลดเอกสารไม่สำเร็จ กรุณาลองใหม่")); });
</script>
</body>
</html>
