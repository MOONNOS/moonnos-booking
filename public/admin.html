<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>จัดการคิว มูนนอส</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Trirong:wght@600&display=swap" rel="stylesheet">
<style>
/* Moonnos back office : consular seal, instrument register */
:root{color-scheme:light;--bg:#f6f2ea;--card:#fffcf6;--ink:#14233f;--mut:#5a5f6c;--line:#e3dac7;--soft:#f1e6cc;--acc:#a9802f;--acc2:#c9a14f;--pri:#14233f;--pritx:#fff;--del:#a3261c;--delbg:#fbecea;--field:#fff;
--serif:"Trirong",Georgia,serif;--sans:"Sarabun","Noto Sans Thai",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0d1626;--card:#142038;--ink:#efe9dc;--mut:#a7adbb;--line:#27334c;--soft:#2a2416;--acc:#d6b062;--acc2:#d6b062;--pri:#d6b062;--pritx:#14233f;--del:#ff9a8f;--delbg:#3a1d1d;--field:#0f1a2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);padding:0 14px 32px}
main{max-width:780px;margin:0 auto;display:grid;gap:14px}

/* top bar : brand + nav, sticks while scrolling */
main>.top:first-child{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -14px;padding:10px 14px;border-bottom:1px solid var(--line)}
h1{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--serif);font-weight:600;font-size:1.22rem;line-height:1.3}
h1::before{content:"";flex:none;width:36px;height:36px;border-radius:50%;background:#fff url(/logo.jpg) center/150% no-repeat;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--acc2)}
h2{font-family:var(--serif);font-weight:600;font-size:1.1rem;margin:0 0 10px;line-height:1.4}

/* cards */
.c{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:0 1px 0 rgba(20,35,63,.03),0 6px 18px -12px rgba(20,35,63,.25)}
main>.c:only-child{margin-top:12vh;padding:24px 20px;border-top:3px solid var(--acc2)}
main>.c:only-child h1{margin-bottom:16px}
.m{color:var(--mut);font-size:.92rem}
#msg{min-height:1.4em;margin:8px 0 0;font-weight:600;color:var(--acc)}

/* controls */
input,textarea,select,button,.lnk{font:inherit;font-size:16px;min-height:46px;border-radius:8px;border:1px solid var(--line);padding:8px 12px;background:var(--field);color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
textarea{min-height:84px;width:100%;resize:vertical}
button,.lnk{cursor:pointer;font-weight:600;background:var(--card)}
button:hover,.lnk:hover{border-color:var(--acc2)}
.lnk{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.p{background:var(--pri);color:var(--pritx);border-color:var(--pri);box-shadow:inset 0 -3px 0 var(--acc2)}
.p:hover{border-color:var(--pri);filter:brightness(1.08)}
.d{color:var(--del);border-color:transparent;background:transparent}
.d:hover{background:var(--delbg);border-color:var(--del)}
select{padding-right:8px;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:140px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

/* admin : open days and bookings */
.s{padding:14px 0;border-top:1px solid var(--line)}
.s strong{font-size:1.02rem}
.b{padding:10px 12px;margin-top:8px;border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:6px;background:var(--bg);display:grid;gap:2px;justify-items:start}
.b a{color:var(--acc);font-weight:600;text-decoration:none}
.b button{margin-top:6px;min-height:40px}
.x{opacity:.55;text-decoration:line-through;border-left-color:var(--line)}

/* docs : tabs as a segmented control */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.tabs button{border:0;background:transparent;min-height:42px;padding:6px 8px;color:var(--mut);border-radius:7px}
.tabs button[aria-pressed="true"]{background:var(--pri);color:var(--pritx);box-shadow:inset 0 -3px 0 var(--acc2)}
.doc{padding:14px 0;border-top:1px solid var(--line)}
.doc strong{font-family:var(--serif);font-weight:600;font-size:1.05rem;letter-spacing:.02em}
.doc .row{margin-top:8px}

/* docs : form */
.fld{display:grid;gap:4px;margin-bottom:12px}.fld label{font-weight:600;font-size:.92rem}
input{width:100%}.row input{width:auto}.row input.grow{width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.irow{border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:6px;padding:10px;margin-bottom:10px;display:grid;gap:8px;background:var(--bg)}
.irow .r2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.irow>.d{justify-self:end;min-height:38px;padding:4px 12px}
.amt{font-weight:700;text-align:right;min-width:90px;font-variant-numeric:tabular-nums}
.sum{display:grid;gap:2px;justify-items:end;margin:12px 0;padding:12px 14px;border-radius:6px;background:var(--soft);border-top:3px double var(--ink)}
.sum b{font-family:var(--serif);font-weight:600;font-size:1.25rem}
form>h2{margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}

@media(max-width:560px){.g2{grid-template-columns:1fr;gap:0}.irow .r2{grid-template-columns:1fr 1fr}.irow .amt{grid-column:1/-1}}
@media(min-width:640px){body{padding:0 20px 40px}main>.top:first-child{margin:0 -20px;padding:12px 20px}.tabs{grid-template-columns:repeat(4,1fr)}.c{padding:20px}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const app = document.getElementById("app");
let token = sessionStorage.getItem("t") || "";
function el(tag, cls, text, attrs) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
const todayStr = () => new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" });
const TH = (s) => {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("th-TH", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
};
async function api(path, opt) {
  const o = opt || {};
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  const r = await fetch(path, { method: o.method || "GET", headers, body: o.body });
  if (r.status === 401 && path !== "/api/admin/login") { token = ""; sessionStorage.removeItem("t"); showLogin(); throw new Error("401"); }
  return r.json();
}
function showLogin() {
  app.textContent = "";
  const c = el("div", "c"), f = el("form", "row"), pw = el("input", "grow", null, { type: "password", placeholder: "รหัสผ่านแอดมิน", autocomplete: "current-password", required: "" });
  const b = el("button", "p", "เข้าสู่ระบบ", { type: "submit" }), m = el("p", "m", "");
  f.append(pw, b);
  f.onsubmit = async (e) => {
    e.preventDefault(); m.textContent = "";
    const r = await api("/api/admin/login", { method: "POST", body: JSON.stringify({ password: pw.value }) });
    if (r.ok) { token = r.token; sessionStorage.setItem("t", token); showMain(); }
    else m.textContent = r.error === "too_many" ? "ลองผิดหลายครั้งเกินไป กรุณารอ 15 นาที" : "รหัสผ่านไม่ถูกต้อง";
  };
  c.append(el("h1", null, "จัดการคิว มูนนอส"), f, m);
  app.append(c);
}
function showMain() {
  app.textContent = "";
  const head = el("div", "top"), out = el("button", null, "ออกจากระบบ", { type: "button" });
  out.onclick = () => { token = ""; sessionStorage.removeItem("t"); showLogin(); };
  const docs = el("a", "lnk", "ใบเสนอราคา / ใบวางบิล", { href: "/docs" }), nav = el("div", "row");
  nav.append(docs, out);
  head.append(el("h1", null, "จัดการคิว มูนนอส"), nav);

  const add = el("div", "c"), f = el("form", "row");
  const date = el("input", "grow", null, { type: "date", required: "", min: todayStr(), "aria-label": "วันที่" });
  const cap = el("input", null, null, { type: "number", min: "0", max: "100", value: "5", style: "width:90px", "aria-label": "จำนวนคิว" });
  const save = el("button", "p", "เปิด/บันทึกวัน", { type: "submit" }), msg = el("p", "m", "", { id: "msg" });
  f.append(date, cap, save);
  f.onsubmit = async (e) => {
    e.preventDefault(); msg.textContent = "";
    const r = await api("/api/admin/slots", { method: "PUT", body: JSON.stringify({ date: date.value, capacity: Number(cap.value) }) });
    msg.textContent = r.ok ? "บันทึกแล้ว" : "บันทึกไม่สำเร็จ กรุณาตรวจวันที่และจำนวนคิว";
    if (r.ok) load();
  };
  add.append(el("h2", null, "เปิดวันรับคิว"), f, el("p", "m", "ใส่จำนวนคิวต่อวัน (ใส่ 0 เพื่อปิดรับวันนั้น) ถ้าเลือกวันที่เคยเปิดไว้แล้ว จะเป็นการแก้จำนวนคิว"), msg);

  const list = el("div", "c");
  app.append(head, add, list);

  async function load() {
    list.textContent = "";
    list.append(el("h2", null, "วันที่เปิดรับ"));
    const r = await api("/api/admin/slots");
    if (!r.slots.length) { list.append(el("p", "m", "ยังไม่มีวันที่เปิดรับ")); return; }
    r.slots.forEach((s) => {
      const box = el("div", "s"), top = el("div", "top"), l = el("div"), btns = el("div", "row"), det = el("div");
      l.append(el("strong", null, TH(s.date)), el("div", "m", s.capacity > 0 ? "จอง " + s.used + " / " + s.capacity + " คน" : "ปิดรับ (จองแล้ว " + s.used + " คน)"));
      const view = el("button", null, "ดูรายชื่อ", { type: "button" });
      const edit = el("button", null, "แก้จำนวน", { type: "button" });
      const del = el("button", "d", "ลบวัน", { type: "button" });
      view.onclick = async () => {
        if (det.textContent) { det.textContent = ""; return; }
        const b = await api("/api/admin/bookings?date=" + s.date);
        if (!b.bookings.length) det.append(el("p", "m", "ยังไม่มีผู้จอง"));
        b.bookings.forEach((x) => {
          const row = el("div", "b" + (x.status === "active" ? "" : " x"));
          row.append(el("strong", null, x.name));
          const tel = el("a", null, " " + x.phone, { href: "tel:" + x.phone });
          row.append(tel);
          if (x.line) row.append(el("div", "m", "LINE: " + x.line));
          if (x.note) row.append(el("div", "m", "หมายเหตุ: " + x.note));
          if (x.status === "active") {
            const c = el("button", "d", "ยกเลิกคิว", { type: "button" });
            c.onclick = async () => { if (confirm("ยกเลิกคิวของ " + x.name + " ?")) { await api("/api/admin/bookings/" + x.id + "/cancel", { method: "POST" }); load(); } };
            row.append(c);
          } else row.append(el("div", "m", "ยกเลิกแล้ว"));
          det.append(row);
        });
      };
      edit.onclick = async () => {
        const v = prompt("จำนวนคิวสูงสุดของวันนี้ (0 = ปิดรับ)", String(s.capacity));
        if (v === null) return;
        const r2 = await api("/api/admin/slots", { method: "PUT", body: JSON.stringify({ date: s.date, capacity: Number(v) }) });
        if (!r2.ok) alert("บันทึกไม่สำเร็จ ใส่ตัวเลข 0-100"); else load();
      };
      del.onclick = async () => {
        if (!confirm("ลบวัน " + TH(s.date) + " ?")) return;
        const r2 = await fetch("/api/admin/slots/" + s.date, { method: "DELETE", headers: { Authorization: "Bearer " + token } });
        const j = await r2.json();
        if (!j.ok) alert(j.error === "has_bookings" ? "ลบไม่ได้ เพราะมีผู้จองอยู่ ให้ยกเลิกคิวทั้งหมดก่อน หรือแก้จำนวนเป็น 0 เพื่อปิดรับ" : "ลบไม่สำเร็จ"); else load();
      };
      btns.append(view, edit, del);
      top.append(l, btns);
      box.append(top, det);
      list.append(box);
    });
  }
  load();
}
if (token) showMain(); else showLogin();
</script>
</body>
</html>
