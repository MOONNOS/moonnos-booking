name: keep-awake

# ปลุกเซิร์ฟเวอร์ Render ทุก 10 นาที เพื่อไม่ให้หลับ (แผนฟรีจะหลับหลังว่าง 15 นาที)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health check
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://moonnos-booking.onrender.com/api/health
